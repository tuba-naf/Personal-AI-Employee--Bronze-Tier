name: AI Employee Wavy - Email Delivery

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 14 */2 * *'
  workflow_dispatch:

jobs:
  send-news-email:
    name: Send News Email
    runs-on: ubuntu-latest
    env:
      VAULT_PATH: ${{ github.workspace }}/Vault
      DRY_RUN: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REVIEWER_EMAIL: ${{ secrets.SMTP_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Send News email
        run: python Vault/Watchers/email_drafts.py --platform news

  send-social-email:
    name: Send LinkedIn and Instagram Email
    runs-on: ubuntu-latest
    env:
      VAULT_PATH: ${{ github.workspace }}/Vault
      DRY_RUN: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REVIEWER_EMAIL: ${{ secrets.SMTP_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Send LinkedIn and Instagram email
        run: python Vault/Watchers/email_drafts.py --platform linkedin instagram
