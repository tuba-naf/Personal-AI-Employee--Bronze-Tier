name: AI Employee Wavy — Email Delivery

on:
  schedule:
    # News email — daily at 7:00 PM PKT (2:00 PM UTC)
    - cron: '0 14 * * *'
    # LinkedIn + Instagram email — every 2 days at 7:30 PM PKT (2:30 PM UTC)
    - cron: '30 14 */2 * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-news-email:
    name: Send News Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Create .env from GitHub Secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
        run: |
          echo "VAULT_PATH=$GITHUB_WORKSPACE/Vault" > .env
          echo "DRY_RUN=false" >> .env
          echo "SMTP_HOST=smtp.gmail.com" >> .env
          echo "SMTP_PORT=587" >> .env
          echo "SMTP_USER=$SMTP_USER" >> .env
          echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env
          echo "REVIEWER_EMAIL=$REVIEWER_EMAIL" >> .env
          echo "--- .env preview (no secrets) ---"
          grep -v "PASSWORD\|USER\|EMAIL" .env

      - name: Check drafts exist
        run: |
          echo "--- Files in Needs_Action ---"
          ls -la Vault/Needs_Action/ || echo "Needs_Action folder not found"

      - name: Send News email
        run: python Vault/Watchers/email_drafts.py --platform news

  send-social-email:
    name: Send LinkedIn and Instagram Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Create .env from GitHub Secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
        run: |
          echo "VAULT_PATH=$GITHUB_WORKSPACE/Vault" > .env
          echo "DRY_RUN=false" >> .env
          echo "SMTP_HOST=smtp.gmail.com" >> .env
          echo "SMTP_PORT=587" >> .env
          echo "SMTP_USER=$SMTP_USER" >> .env
          echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env
          echo "REVIEWER_EMAIL=$REVIEWER_EMAIL" >> .env
          echo "--- .env preview (no secrets) ---"
          grep -v "PASSWORD\|USER\|EMAIL" .env

      - name: Check drafts exist
        run: |
          echo "--- Files in Needs_Action ---"
          ls -la Vault/Needs_Action/ || echo "Needs_Action folder not found"

      - name: Send LinkedIn and Instagram email
        run: python Vault/Watchers/email_drafts.py --platform linkedin instagram
