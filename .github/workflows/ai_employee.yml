name: AI Employee Wavy - Content & Email

on:
  schedule:
    - cron: '0 4 * * *'      # Daily at 9:00 AM PKT (4:00 AM UTC) — News
    - cron: '0 4 */2 * *'    # Every 2 days at 9:00 AM PKT — LinkedIn & Instagram
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to run: news | linkedin instagram | all'
        required: false
        default: 'all'

# ─────────────────────────────────────────────────────────────
# NEWS — runs every day
# ─────────────────────────────────────────────────────────────
jobs:
  news:
    name: News — Daily Draft & Email
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VAULT_PATH: ${{ github.workspace }}/Vault
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DRY_RUN: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REVIEWER_EMAIL: ${{ secrets.SMTP_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install feedparser python-dotenv openai

      - name: Generate news draft
        run: |
          cd Vault/Watchers
          python scheduled_run.py --platform news

      - name: Commit draft to repo
        run: |
          git config user.name "AI Employee Wavy"
          git config user.email "actions@github.com"
          git add Vault/Inbox/ Vault/Needs_Action/ Vault/Completed/ Vault/Plans/
          git diff --staged --quiet || (git commit -m "chore: add news draft [skip ci]" && git push)

      - name: Send news email
        run: |
          cd Vault/Watchers
          python email_drafts.py --platform news

      - name: Commit emailed status
        run: |
          git config user.name "AI Employee Wavy"
          git config user.email "actions@github.com"
          git pull --rebase --autostash
          git add Vault/Inbox/ Vault/Needs_Action/ Vault/Completed/
          git diff --staged --quiet || (git commit -m "chore: mark news as emailed [skip ci]" && git push)

# ─────────────────────────────────────────────────────────────
# SOCIAL — runs every 2 days
# ─────────────────────────────────────────────────────────────
  social:
    name: LinkedIn & Instagram — Bi-Daily Draft & Email
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 4 */2 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VAULT_PATH: ${{ github.workspace }}/Vault
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DRY_RUN: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REVIEWER_EMAIL: ${{ secrets.SMTP_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install feedparser python-dotenv openai

      - name: Generate LinkedIn & Instagram drafts
        run: |
          cd Vault/Watchers
          python scheduled_run.py --platform linkedin instagram

      - name: Commit drafts to repo
        run: |
          git config user.name "AI Employee Wavy"
          git config user.email "actions@github.com"
          git add Vault/Inbox/ Vault/Needs_Action/ Vault/Completed/ Vault/Plans/
          git diff --staged --quiet || (git commit -m "chore: add social drafts [skip ci]" && git push)

      - name: Send LinkedIn & Instagram email
        run: |
          cd Vault/Watchers
          python email_drafts.py --platform linkedin instagram

      - name: Commit emailed status
        run: |
          git config user.name "AI Employee Wavy"
          git config user.email "actions@github.com"
          git pull --rebase --autostash
          git add Vault/Inbox/ Vault/Needs_Action/ Vault/Completed/
          git diff --staged --quiet || (git commit -m "chore: mark social as emailed [skip ci]" && git push)
