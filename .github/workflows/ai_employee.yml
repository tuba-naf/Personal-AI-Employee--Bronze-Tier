name: AI Employee Wavy — Email Delivery

on:
  schedule:
    # News email — daily at 7:00 PM PKT (2:00 PM UTC)
    - cron: '0 14 * * *'
    # LinkedIn + Instagram email — every 2 days at 7:30 PM PKT (2:30 PM UTC)
    - cron: '30 14 */2 * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  send-news-email:
    name: Send News Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Create .env from GitHub Secrets
        run: |
          printf "VAULT_PATH=%s/Vault\n" "$GITHUB_WORKSPACE" > .env
          printf "DRY_RUN=false\n" >> .env
          printf "SMTP_HOST=smtp.gmail.com\n" >> .env
          printf "SMTP_PORT=587\n" >> .env
          printf "SMTP_USER=%s\n" "${{ secrets.SMTP_USER }}" >> .env
          printf "SMTP_PASSWORD=%s\n" "${{ secrets.SMTP_PASSWORD }}" >> .env
          printf "REVIEWER_EMAIL=%s\n" "${{ secrets.REVIEWER_EMAIL }}" >> .env
          echo "--- .env preview (no secrets) ---"
          grep -v "PASSWORD\|USER\|EMAIL" .env

      - name: Check drafts exist
        run: |
          echo "--- Files in Needs_Action ---"
          ls -la Vault/Needs_Action/ || echo "Needs_Action folder not found"

      - name: Send News email
        run: python Vault/Watchers/email_drafts.py --platform news

  send-social-email:
    name: Send LinkedIn and Instagram Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install feedparser python-dotenv watchdog requests

      - name: Create .env from GitHub Secrets
        run: |
          printf "VAULT_PATH=%s/Vault\n" "$GITHUB_WORKSPACE" > .env
          printf "DRY_RUN=false\n" >> .env
          printf "SMTP_HOST=smtp.gmail.com\n" >> .env
          printf "SMTP_PORT=587\n" >> .env
          printf "SMTP_USER=%s\n" "${{ secrets.SMTP_USER }}" >> .env
          printf "SMTP_PASSWORD=%s\n" "${{ secrets.SMTP_PASSWORD }}" >> .env
          printf "REVIEWER_EMAIL=%s\n" "${{ secrets.REVIEWER_EMAIL }}" >> .env
          echo "--- .env preview (no secrets) ---"
          grep -v "PASSWORD\|USER\|EMAIL" .env

      - name: Check drafts exist
        run: |
          echo "--- Files in Needs_Action ---"
          ls -la Vault/Needs_Action/ || echo "Needs_Action folder not found"

      - name: Send LinkedIn and Instagram email
        run: python Vault/Watchers/email_drafts.py --platform linkedin instagram
